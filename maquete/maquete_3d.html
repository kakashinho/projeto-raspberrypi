<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }

  #ui button.on { background: #2f6fd8; color: #fff; border-color: #2f6fd8; }
  #leitura { margin-top: 6px; padding: 5px 7px; border-radius: 6px; background: #f1f4f8; font-size: 12.5px; }

         vertical-align: -1px; box-shadow: 0 0 5px #22dd44; }
  #info { position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: 12px; color: #333;
          background: rgba(255,255,255,.85); border-radius: 8px; padding: 6px 10px; }

}

// placa de papelão: contorno 2D (com furos) extrudado na espessura
function geoPlaca(pl, o, c, f, t) {
  const shape = new THREE.Shape(c.map(p => new THREE.Vector2(p[0], p[1])));
  for (const h of f || []) {
    if (Array.isArray(h)) shape.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1]))));
    else { const p = new THREE.Path(); p.absarc(h.c[0], h.c[1], h.c[2], 0, Math.PI * 2, false); shape.holes.push(p); }
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: t, bevelEnabled: false, curveSegments: 20 });
  const tv = V(o[0], o[1], o[2]);
  const m = new THREE.Matrix4();
  if (pl === 'xy') m.set(1, 0, 0, tv.x, 0, 0, 1, tv.y, 0, -1, 0, tv.z, 0, 0, 0, 1);
  else if (pl === 'xz') m.set(1, 0, 0, tv.x, 0, 1, 0, tv.y, 0, 0, 1, tv.z - t, 0, 0, 0, 1);
  else m.set(0, 0, 1, tv.x, 0, 1, 0, tv.y, -1, 0, 0, tv.z, 0, 0, 0, 1);
  geo.applyMatrix4(m);
  return geo;
}

// adesivo como textura na face de fora (a face de cima/baixo da placa; as laterais ficam na cor do papel).
// A arte vem em PNG com transparência e cobre o contorno todo da peça; por baixo vai a cor do papel.
function texturaAdesivo(it) {
  const a = S.texturas[it.tex];
  const m = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.85, side: THREE.DoubleSide });
  const img = new Image();
  img.onload = () => {
    const px = 5;                                     // pixels por mm
    const cv = document.createElement('canvas');
    cv.width = Math.round(a.w * px); cv.height = Math.round(a.h * px);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = it.cor; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.repeat.set(1 / a.w, 1 / a.h);                 // as coordenadas da face vêm em mm...
    tex.offset.set(-a.x0 / a.w, -a.y0 / a.h);         // ...e a arte começa no canto (x0, y0) da peça
    if (a.espelho) { tex.repeat.x = -1 / a.w; tex.offset.x = (a.x0 + a.w) / a.w; }   // parede de trás: a arte é lida de fora
    tex.anisotropy = 4;
    m.map = tex; m.needsUpdate = true;
  };
  img.src = 'data:image/png;base64,' + a.png;
  return [m, mat(it.cor)];
}

for (const it of S.itens) {
  let obj, base = new THREE.Vector3();
  if (it.k === 'placa') {
    const geo = geoPlaca(it.pl, it.o, it.c, it.f, it.t);
    obj = new THREE.Group();
    obj.add(new THREE.Mesh(geo, it.tex && S.texturas[it.tex] ? texturaAdesivo(it) : mat(it.cor)));
    if (it.t > 0.5) obj.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), linhaMat));
    if (it.fl) {
      const g2 = geoPlaca('xy', it.fl.o, it.fl.c, it.fl.f, it.t);
      pastaG.add(new THREE.Mesh(g2, mat(it.cor)));
      pastaG.add(new THREE.LineSegments(new THREE.EdgesGeometry(g2, 25), linhaMat));
    }
  } else if (it.k === 'caixa') {
    const a = it.a, b = it.b;
    const geo = new THREE.BoxGeometry(Math.abs(b[0] - a[0]), Math.abs(b[2] - a[2]), Math.abs(b[1] - a[1]));
    obj = new THREE.Mesh(geo, mat(it.cor, it.op));
    base = V((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2);
  } else if (it.k === 'plano') {
    // adesivo plano sobre uma peça (ex.: desenho da placa de interface): a imagem é transparente onde não há nada
    const m = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6, transparent: true, alphaTest: 0.02, side: THREE.DoubleSide });
    new THREE.TextureLoader().load('data:image/png;base64,' + S.texturas[it.tex].png, t => {
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; m.map = t; m.needsUpdate = true;
    });
    obj = new THREE.Mesh(new THREE.PlaneGeometry(it.w, it.h), m);
    obj.rotation.x = -Math.PI / 2;                    // deitado, com a frente da placa para cima
    base = V(it.p[0], it.p[1], it.p[2]);
  } else {
    const geo = new THREE.CylinderGeometry(it.r, it.r, it.h, 28);
    const p = it.p.slice();
    if (it.ax === 'x') { geo.rotateZ(Math.PI / 2); p[0] += it.h / 2; }
    else if (it.ax === 'y') { geo.rotateX(Math.PI / 2); p[1] += it.h / 2; }
    else p[2] += it.h / 2;
    obj = new THREE.Mesh(geo, it.n === 'LED' ? ledMat : mat(it.cor, it.op));
    base = V(p[0], p[1], p[2]);
  }
  obj.position.copy(base);
  obj.userData.base = base.clone();
  obj.userData.e = new THREE.Vector3(it.e[0], it.e[2], -it.e[1]);
  container(it.u).add(obj);
  registra(it.g, obj);
}

function sprite(txt, s, fundo) {
  const fs = 44, pad = 14;
  const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
  const fonte = `600 ${fs}px "Segoe UI", Arial, sans-serif`;
  ctx.font = fonte;
  const w = Math.ceil(ctx.measureText(txt).width) + pad * 2, h = fs + pad * 2 - 6;
  cv.width = w; cv.height = h;
  ctx.font = fonte;
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(1.5, 1.5, w - 3, h - 3, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1b1b1b'; ctx.textBaseline = 'middle'; ctx.fillText(txt, pad, h / 2 + 1);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: !!fundo, transparent: true }));
  sp.scale.set(s * w / h, s, 1); sp.renderOrder = fundo ? 0 : 20;
  return sp;
}
for (const r of S.rotulos) {

}

const coneMat = new THREE.MeshBasicMaterial({ color: '#ffd400', transparent: true, opacity: 0.30, side: THREE.DoubleSide, depthWrite: false });
let cone = null, coneL = -1;
function setCone(L) {
  if (Math.abs(L - coneL) < 0.05) return;
  coneL = L;
  if (cone) { montada.remove(cone); cone.geometry.dispose(); }
  const rS = 6, rB = rS + L * Math.tan(7.5 * Math.PI / 180);
  const g = new THREE.CylinderGeometry(rB, rS, L, 40, 1, true); g.rotateZ(-Math.PI / 2);
  cone = new THREE.Mesh(g, coneMat);
  cone.position.copy(V(S.sensor.x + L / 2, S.sensor.y, S.sensor.z));
  cone.visible = estado.modo !== 'pasta';
  montada.add(cone);
}
function leituraSensor() {
  const g = unidades['espera'];
  const cx = g.position.x + W / 2, cy = -g.position.z + D / 2;
  const a = Math.abs(g.rotation.y) % Math.PI;
  const deitado = a > Math.PI / 4 && a < 3 * Math.PI / 4;
  const hx = deitado ? S.carro.L / 2 : S.carro.W / 2, hy = deitado ? S.carro.W / 2 : S.carro.L / 2;
  const s = S.sensor;
  if (cy + hy > s.y - 8 && cy - hy < s.y + 8 && cx - hx > s.x && cx - hx < s.parede) return { L: cx - hx - s.x, viu: true };
  return { L: s.parede - s.x, viu: false };
}

// ------------------------------------------------------------ estado e controles
const estado = { modo: 'montada', exp: 0 };
function aplicaVisibilidade() {
  const p = estado.modo === 'pasta';
  for (const [g, objs] of Object.entries(grupos)) {
    let vis;
    if (p) vis = g === 'piso';
    else { const cb = document.querySelector(`input[data-g="${g}"]`); vis = cb ? cb.checked : true; }
    for (const o of objs) o.visible = vis;
  }
  pastaG.visible = p; caixaPasta.visible = p;
  if (cone) cone.visible = !p;
  mesa.position.y = p ? -S.pasta.T - 0.3 : -S.elev - 0.05;
  document.getElementById('btnPasta').classList.toggle('on', p);
}
function aplicaExplode(f) {
  for (const objs of Object.values(grupos))
    for (const o of objs) o.position.copy(o.userData.base).addScaledVector(o.userData.e, f);
}
function setAng(qual, graus) {
  const u = unidades[qual === 'E' ? 'bracoE' : 'bracoS'];
  u.rotation.z = u.userData.sinal * graus * Math.PI / 180;
  document.getElementById('ang' + qual).value = graus;
  document.getElementById('v' + qual).textContent = Math.round(graus) + '°';
}
const CORES_LED = { verde: '#22dd44', amarelo: '#ffcc00', vermelho: '#ff2222' };
function setLED(c) {
  ledMat.color.set(CORES_LED[c]); ledMat.emissive.set(CORES_LED[c]);
  const el = document.getElementById('led'); el.style.background = CORES_LED[c]; el.style.boxShadow = '0 0 6px ' + CORES_LED[c];
}
function posCarro(dy, dx = 0, rot = 0) {
  const g = unidades['espera'], pv = g.userData.pivo;
  g.position.set(pv.x + dx, pv.y, pv.z - dy); g.rotation.y = rot;
}
function lotado(on) { if (unidades['vaga4']) unidades['vaga4'].visible = on; }

for (const cb of document.querySelectorAll('input[data-g]')) cb.addEventListener('change', aplicaVisibilidade);
for (const q of ['E', 'S']) document.getElementById('ang' + q).addEventListener('input', e => setAng(q, +e.target.value));
document.getElementById('exp').addEventListener('input', e => { estado.exp = e.target.value / 100; aplicaExplode(estado.exp); });
document.getElementById('lotado').addEventListener('change', e => lotado(e.target.checked));
document.getElementById('btnPasta').addEventListener('click', () => {
  estado.modo = estado.modo === 'pasta' ? 'montada' : 'pasta';
  aplicaExplode(estado.modo === 'pasta' ? 0 : estado.exp);
  aplicaVisibilidade(); vista(estado.modo === 'pasta' ? 'pasta' : 'normal');
});
for (const b of document.querySelectorAll('button[data-v]')) b.addEventListener('click', () => vista(b.dataset.v));

let anim = null;
document.getElementById('btnCarro').addEventListener('click', () => {
  if (estado.modo === 'pasta') document.getElementById('btnPasta').click();
  anim = { t0: performance.now() / 1000, lot: document.getElementById('lotado').checked };
});
const ease = t => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
function estadoAnim(t, lot) {
  // estado completo em função do tempo: posição do carro, ângulo da cancela e cor do LED
  const C = S.carro;
  const dyFora = -C.L - 15 - C.espera_y0;
  const dyCorr = C.corredor_y - (C.espera_y0 + C.L / 2);
  if (t < 2.5) return { dy: dyFora * (1 - ease(t / 2.5)), dx: 0, rot: 0, ang: 0, led: 'verde' };
  if (lot) return { dy: 0, dx: 0, rot: 0, ang: 0, led: 'vermelho' };
  if (t < 3.2) return { dy: 0, dx: 0, rot: 0, ang: 0, led: 'amarelo' };
  if (t < 4.2) return { dy: 0, dx: 0, rot: 0, ang: 90 * ease(t - 3.2), led: 'amarelo' };
  if (t < 5.6) return { dy: dyCorr * ease((t - 4.2) / 1.4), dx: 0, rot: 0, ang: 90, led: 'amarelo' };
  if (t < 6.4) return { dy: dyCorr, dx: 0, rot: -Math.PI / 2 * ease((t - 5.6) / 0.8), ang: 90, led: 'amarelo' };
  return { dy: dyCorr, dx: 95 * ease((t - 6.4) / 1.6), rot: -Math.PI / 2, ang: 90 * (1 - ease(t - 6.4)), led: 'verde' };
}
function passoAnim(agora) {
  if (!anim) return;
  const fixo = params.has('t');
  const t = fixo ? parseFloat(params.get('t')) : agora / 1000 - anim.t0;
  const e = estadoAnim(t, anim.lot);
  posCarro(e.dy, e.dx, e.rot); setAng('E', e.ang); setLED(e.led);
  if (!fixo && t > 8.5) anim = null;
}

function vista(nome) {
  let alvo = V(W / 2 + 20, D / 2 - 40, 0), pos;
  if (nome === 'cima') { alvo = V(W / 2, D / 2, 0); pos = V(W / 2, D / 2 - 1, 720); }
  else if (nome === 'frente') pos = V(W / 2, -470, 110);
  else if (nome === 'baixo') { pos = V(W / 2 + 230, -330, -300); alvo = V(W / 2, D / 2, -50); }
  else if (nome === 'pasta') { pos = V(W / 2 - 90, -300, 300); alvo = V(W / 2, D / 2, 10); }
  else pos = V(W / 2 - 150, -380, 560);               // de cima e de frente: o estacionamento aparece atrás da guarita
  camera.position.copy(pos); controls.target.copy(alvo); controls.update();
}

function ajustaTela() {
  camera.aspect = innerWidth / innerHeight;
  if (innerWidth > 900) camera.setViewOffset(innerWidth, innerHeight, -140, 0, innerWidth, innerHeight);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', ajustaTela);
ajustaTela();

// ------------------------------------------------------------ início (parâmetros na URL servem para conferir)
const [c0, e0, v0] = S.texto.sensor;
for (const g of (params.get('ocultar') || '').split(',')) {
  const cb = document.querySelector(`input[data-g="${g}"]`); if (cb) cb.checked = false;
}
if (params.get('lotado') === '1') document.getElementById('lotado').checked = true;
lotado(document.getElementById('lotado').checked);
if (params.has('exp')) { estado.exp = +params.get('exp'); document.getElementById('exp').value = estado.exp * 100; }
if (params.get('modo') === 'pasta') estado.modo = 'pasta';
if (params.get('ui') === '0') for (const e of document.querySelectorAll('#ui, #info')) e.style.display = 'none';   // captura limpa
aplicaVisibilidade(); aplicaExplode(estado.modo === 'pasta' ? 0 : estado.exp);
setAng('E', +(params.get('angE') || 0)); setAng('S', +(params.get('angS') || 0));
if (params.get('anim') === '1') anim = { t0: performance.now() / 1000, lot: document.getElementById('lotado').checked };
vista(params.get('vista') || (estado.modo === 'pasta' ? 'pasta' : 'normal'));
if (params.has('cam')) {
  const c = params.get('cam').split(',').map(Number), t = (params.get('alvo') || '0,0,0').split(',').map(Number);
  camera.position.copy(V(c[0], c[1], c[2])); controls.target.copy(V(t[0], t[1], t[2])); controls.update();
}

function loop(agora) {
  passoAnim(agora);
  const r = leituraSensor();
  setCone(r.L);
  const txt = estado.modo === 'pasta'
    ? `Pilha: ${alturaPilha.toFixed(1)} mm (piso com EVA e batentes + ${S.pasta.camadas} camadas). Pasta: lombada de ${pLomb} mm.`
    : `Sensor: ${r.L.toFixed(0)} mm, ${r.viu ? 'CARRO' : 'sem carro'} (limiar ${S.sensor.limiar} mm). ` +
      `Carro centrado ${c0}, encostado ${e0}, vazio ${v0} mm.`;
  document.getElementById('txtSensor').textContent = txt;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
window.__ok = true;
requestAnimationFrame(loop);
</script>
